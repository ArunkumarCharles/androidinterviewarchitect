name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FIRST_SEC: ${{ secrets.FIRST_SEC }}
      SECOND_KEY: ${{ secrets.SECOND_KEY }}
      ORG_GRADLE_PROJECT_FIRST_SEC: ${{ secrets.FIRST_SEC }}
      ORG_GRADLE_PROJECT_SECOND_KEY: ${{ secrets.SECOND_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up local.properties with Secrets
        run: |
          touch local.properties
          echo "FIRST_SEC=${{ secrets.FIRST_SEC }}" >> local.properties
          echo "SECOND_KEY=${{ secrets.SECOND_KEY }}" >> local.properties

      - name: Static analysis, lint, unit tests, assemble (debug + R8 release)
        run: ./gradlew detekt lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: "**/build/reports/"
