name: PR Workflow

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Validation & Build
    runs-on: ubuntu-latest

    env:
      FIRST_SEC: ${{ secrets.FIRST_SEC }}
      SECOND_KEY: ${{ secrets.SECOND_KEY }}
      ORG_GRADLE_PROJECT_FIRST_SEC: ${{ secrets.FIRST_SEC }}
      ORG_GRADLE_PROJECT_SECOND_KEY: ${{ secrets.SECOND_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up local.properties with Secrets
        run: |
          touch local.properties
          echo "FIRST_SEC=${{ secrets.FIRST_SEC }}" >> local.properties
          echo "SECOND_KEY=${{ secrets.SECOND_KEY }}" >> local.properties

      - name: Run Detekt Static Analysis
        run: ./gradlew detekt --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Builds (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Build & Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-reports
          path: "**/build/reports/"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: "**/build/test-results/"
